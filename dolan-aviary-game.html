<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dolan Aviary</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; user-select: none; }
        body {
            margin: 0; padding: 0;
            height: 100dvh; width: 100vw;
            background-color: #222;
            font-family: 'Press Start 2P', cursive; 
            overflow: hidden; touch-action: none; 
            display: flex; justify-content: center; align-items: center;
        }

        #game-stage {
            position: relative;
            width: 100%; max-width: 480px; height: 100%;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            background: #87CEEB; /* LANGIT CERAH */
        }

        canvas { 
            display: block; width: 100%; height: 100%; z-index: 1; 
            image-rendering: pixelated; 
            image-rendering: crisp-edges; 
        }

        /* --- UI Styles --- */
        .ui-layer { position: absolute; pointer-events: none; z-index: 50; }
        
        /* PERBAIKAN POSISI SKOR: Pindah ke Kanan Atas agar tidak tertutup User Profile */
        #score-display {
            top: 20px; right: 20px; width: auto;
            font-size: 2.5rem; color: #FFD700; 
            text-shadow: 4px 4px 0 #000; 
            transition: transform 0.1s;
            text-align: right;
        }
        .score-pop { transform: scale(1.3); }

        #tutorial-hint {
            top: 60%; width: 100%; text-align: center;
            font-size: 0.7rem; color: #fff;
            text-shadow: 2px 2px 0 #000;
            animation: pulse 1.5s infinite;
            display: none; letter-spacing: 1px; line-height: 1.5;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        #flash-overlay {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: white; opacity: 0; pointer-events: none; z-index: 99;
            transition: opacity 0.1s ease-out;
        }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex; flex-direction: column; 
            justify-content: center; align-items: center;
            z-index: 60; display: none;
        }

        #loading-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #87CEEB; z-index: 100;
            display: flex; justify-content: center; align-items: center; flex-direction: column;
            color: #2c3e50; font-size: 0.8rem; text-shadow: 1px 1px 0 #fff; line-height: 1.5; text-align: center;
        }

        #user-info {
            position: absolute; top: 15px; left: 15px; z-index: 70;
            display: flex; align-items: center; gap: 10px;
            background: #e4c684; padding: 8px; 
            border: 4px solid #000;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.5);
            pointer-events: auto; display: none; color: #000; font-size: 0.6rem;
        }
        #user-avatar { width: 32px; height: 32px; border: 2px solid #000; image-rendering: pixelated; }

        /* Tombol mute -- pojok kiri bawah, tidak tumpang tindih dengan #user-info (kiri
           atas) atau #score-display (kanan atas). Gaya kotak piksel sama dengan tombol
           lain di game ini supaya terasa satu set, bukan elemen asing. */
        #btn-mute {
            position: absolute; bottom: 15px; left: 15px; z-index: 70;
            width: 40px; height: 40px; font-size: 1.1rem; line-height: 1;
            background: #e4c684; border: 3px solid #000; box-shadow: 3px 3px 0 rgba(0,0,0,0.5);
            cursor: pointer; pointer-events: auto;
        }
        #btn-mute:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 rgba(0,0,0,0.5); }

        .btn {
            background: #ff7f50; 
            border: 4px solid #000;
            box-shadow: 4px 4px 0 #000;
            color: white; padding: 16px 20px; font-size: 0.8rem;
            font-family: inherit; cursor: pointer; margin: 10px;
            text-transform: uppercase; width: 90%; max-width: 320px;
            pointer-events: auto; position: relative; text-shadow: 2px 2px 0 #000;
        }
        .btn:active { top: 4px; box-shadow: 0 0 0 #000; }
        .btn-google { background: #4285F4; }
        .btn-green { background: #73BF2E; }

        .lb-container {
            width: 90%; max-width: 340px; background: #e4c684;
            border: 4px solid #000;
            padding: 10px; margin-bottom: 20px; pointer-events: auto;
            box-shadow: 6px 6px 0 rgba(0,0,0,0.5); font-size: 0.7rem;
        }
        .tab {
            flex: 1; padding: 8px; cursor: pointer;
            background: #c0a060; border: 2px solid #000; color: #000; text-align: center;
            margin: 0 2px;
        }
        .tab.active { background: #ff7f50; color: white; border-bottom: none; transform: translateY(2px); }
        #lb-list { height: 180px; overflow-y: auto; background: #fff; border: 2px solid #000; padding: 8px; }
        .lb-row { display: flex; justify-content: space-between; margin-bottom: 4px;}

        /* --- VOUCHER STYLES (BARU) --- */
        #voucher-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 200; /* Paling Depan */
            display: none; justify-content: center; align-items: center;
            padding: 20px;
        }
        .voucher-card {
            background: #FFF8DC; border: 4px dashed #FF4500;
            padding: 20px; width: 100%; max-width: 380px;
            text-align: center; position: relative;
            box-shadow: 0 0 30px #FFD700;
            animation: bounceIn 0.6s;
        }
        @keyframes bounceIn {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        .v-title { color: #FF4500; font-size: 1.2rem; margin-bottom: 15px; line-height: 1.4; text-shadow: 2px 2px 0 #000; }
        .v-reward { 
            background: #fff; border: 4px solid #000; padding: 15px; 
            color: #008000; font-size: 0.8rem; line-height: 1.6; margin: 15px 0;
            font-weight: bold;
        }
        .v-info { font-size: 0.6rem; color: #333; line-height: 1.5; margin-bottom: 10px; }
        .v-warning { font-size: 0.5rem; color: #777; font-style: italic; margin-top: 10px;}
        .v-code {
            background: #000; color: #FFD700; font-size: 0.85rem; letter-spacing: 1px;
            padding: 10px; margin: 12px 0; border: 2px dashed #FFD700;
        }
        .v-login-btn {
            background: #4285F4; color: #fff; border: 3px solid #000; box-shadow: 3px 3px 0 #000;
            padding: 12px 18px; font-family: inherit; font-size: 0.65rem; cursor: pointer; margin-top: 10px;
        }
        
        #btn-close-voucher {
            position: absolute; top: -12px; right: -12px;
            width: 28px; height: 28px; 
            background: #FF0000; border: 2px solid #fff;
            color: white; font-size: 10px; cursor: pointer;
            box-shadow: 2px 2px 0 #000;
            display: flex; justify-content: center; align-items: center;
        }
        #btn-close-voucher:hover { transform: scale(1.1); }

    </style>
</head>
<body>

    <div id="game-stage">
        <canvas id="gameCanvas"></canvas>
        
        <div id="loading-screen">
            <div style="font-size: 1.2rem; margin-bottom: 10px;">MEMUAT GAME...</div>
            <div>Mengatur Posisi Gunung & Plang</div>
        </div>

        <div class="ui-layer" id="score-display" style="display:none;">0</div>

        <div class="ui-layer" id="tutorial-hint">TAP / SPASI<br>UNTUK TERBANG</div>
        <div class="ui-layer" id="pause-hint" style="top:50%; width:100%; text-align:center; font-size:0.9rem; color:#fff; text-shadow:2px 2px 0 #000; display:none;">⏸ DIJEDA<br><span style="font-size:0.55rem;">TAP UNTUK LANJUT</span></div>
        <div id="flash-overlay"></div>
        <button id="btn-mute" aria-label="Mute/unmute suara">🔊</button>

        <div id="user-info">
            <img id="user-avatar" src="" alt="">
            <div>
                <div id="user-name">Player</div>
                <div id="loc-badge">📍 Cari Lokasi...</div>
            </div>
        </div>

        <div id="voucher-overlay">
            <div class="voucher-card">
                <div id="btn-close-voucher">X</div>
                <!-- Diisi dinamis oleh renderVoucher() di bawah -- isinya beda tergantung
                     hasil klaim (berhasil dapat kode / belum login / sudah klaim hari ini). -->
                <div id="voucher-body"></div>
            </div>
        </div>

        <div id="screen-start" class="screen" style="display: none;">
            <h1 style="color:#FFD700; text-shadow: 4px 4px 0 #000, -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000; font-size:2rem; text-align:center; margin-bottom:30px; line-height: 1.2;">
                DOLAN<br>AVIARY
            </h1>
            
            <div id="login-section" style="width:100%; text-align:center;">
                <p style="color:#fff; font-size:0.7rem; margin-bottom:15px; text-shadow: 2px 2px 0 #000;">Login untuk Simpan Skor</p>
                <button class="btn btn-google" id="btn-login">🔑 Login Google</button>
                <button class="btn btn-green" id="btn-guest">Main Tanpa Login</button>
            </div>
            
            <div id="play-section" style="display:none; text-align:center; width: 100%;">
                <button class="btn btn-green" id="btn-start" style="font-size: 1rem; padding: 20px 30px;">START ▶</button>
                <button class="btn" id="btn-logout" style="background:#777; width:auto; font-size:0.6rem; padding: 12px 18px;">Logout</button>
            </div>
        </div>

        <div id="screen-over" class="screen">
            <h2 style="color:#FF6B6B; text-shadow:4px 4px 0 #000; font-size:1.8rem; margin-bottom:20px;">GAME OVER</h2>
            <div style="background:#e4c684; border:4px solid #000; padding:15px 25px; text-align:center; margin-bottom:20px; box-shadow: 6px 6px 0 rgba(0,0,0,0.5);">
                <div style="font-size:0.7rem; color:#000; margin-bottom: 5px;">SKOR KAMU</div>
                <div id="final-score" style="font-size:2.5rem; color:#E86101; text-shadow: 3px 3px 0 #000;">0</div>
            </div>
            <div class="lb-container">
                <div class="tabs" style="display: flex;">
                    <div class="tab" id="tab-today">HARI INI</div>
                    <div class="tab active" id="tab-global">GLOBAL</div>
                    <div class="tab" id="tab-local">LOKAL</div>
                </div>
                <div id="lb-list">
                    <div style="text-align:center; padding:20px; font-size:0.6rem; color:#888;">Memuat...</div>
                </div>
            </div>
            <button class="btn btn-green" id="btn-restart" style="font-size: 0.8rem;">MAIN LAGI ↺</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged }
               from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, query, orderBy, limit, where, onSnapshot, serverTimestamp }
               from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDH6cBMyBCNdzG_tdJNs28AZZIm8HnO8l4",
            authDomain: "flytap-ca3ee.firebaseapp.com",
            projectId: "flytap-ca3ee",
            storageBucket: "flytap-ca3ee.firebasestorage.app",
            messagingSenderId: "690738199480",
            appId: "1:690738199480:web:b1b442690440db79016d4d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let playerCity = "Unknown";
        let lbMode = 'global';
        let unsubscribe = null;
        let userHighScore = 0;

        // Kunci tanggal lokal (zona waktu pemain, bukan UTC) dipakai untuk leaderboard
        // "Hari Ini" dan batas 1x klaim voucher/hari -- cukup presisi "hari apa", tidak
        // perlu seakurat server. Timestamp sebenarnya tetap serverTimestamp() (lihat
        // saveScore/claimVoucher) supaya tidak bisa dipalsukan lewat jam HP yang diubah.
        function todayKey() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        async function detectLocation() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                if(data.city) {
                    playerCity = data.city;
                    document.getElementById('loc-badge').innerText = `📍 ${playerCity}`;
                }
            } catch(e) { console.log("Loc fail"); }
        }
        detectLocation();

        const uiLogin = document.getElementById('login-section');
        const uiPlay = document.getElementById('play-section');
        const uiInfo = document.getElementById('user-info');

        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            if (user) {
                uiLogin.style.display = 'none';
                uiPlay.style.display = 'block';
                uiInfo.style.display = 'flex';
                document.getElementById('user-name').innerText = user.displayName;
                document.getElementById('user-avatar').src = user.photoURL;

                // Ambil rekor terbaik pemain ini dari dokumennya sendiri (bukan cuma
                // berharap dia kebetulan muncul di 10 besar yang ditampilkan) -- dulu ini
                // bug nyata: kalau skor terbaik pemain tidak masuk top 10, userHighScore
                // tetap 0 selamanya, jadi SETIAP skor baru dikira rekor baru & tersimpan
                // sebagai entri terpisah (ini penyebab satu pemain bisa menguasai
                // beberapa baris leaderboard sekaligus, ditemukan nyata 2026-10-04).
                try {
                    const mySnap = await getDoc(doc(db, "leaderboard", user.uid));
                    userHighScore = mySnap.exists() ? (mySnap.data().score || 0) : 0;
                } catch(e) { userHighScore = 0; }
            } else {
                uiLogin.style.display = 'block';
                uiPlay.style.display = 'none';
                uiInfo.style.display = 'none';
                userHighScore = 0;
            }
        });

        document.getElementById('btn-login').onclick = () => signInWithPopup(auth, provider);
        document.getElementById('btn-logout').onclick = () => signOut(auth);
        document.getElementById('btn-guest').onclick = () => { game.start(); };

        const lbList = document.getElementById('lb-list');
        const tabGlobal = document.getElementById('tab-global');
        const tabLocal = document.getElementById('tab-local');
        const tabToday = document.getElementById('tab-today');
        const ALL_TABS = { global: tabGlobal, local: tabLocal, today: tabToday };

        function switchTab(mode) {
            lbMode = mode;
            for (const [key, el] of Object.entries(ALL_TABS)) el.classList.toggle('active', key === mode);
            loadLeaderboard();
        }

        tabGlobal.onclick = () => switchTab('global');
        tabLocal.onclick = () => switchTab('local');
        tabToday.onclick = () => switchTab('today');

        // Dipanggil sekali langsung saat halaman terbuka (lihat pemanggilan di bawah),
        // BUKAN cuma dari dalam onAuthStateChanged seperti sebelumnya -- itu bug nyata:
        // pemain yang main tanpa login (kemungkinan besar MAYORITAS pengunjung resto)
        // tidak pernah memicu query ini, jadi tab leaderboard macet di "Memuat..."
        // selamanya sampai mereka kebetulan mengklik sebuah tab. Query leaderboard
        // tidak butuh login (lihat firestore.rules -- read publik), jadi aman dipanggil
        // dari awal untuk siapa saja.
        function loadLeaderboard() {
            if(unsubscribe) unsubscribe();
            lbList.innerHTML = '<div style="text-align:center; padding:20px; font-size:0.6rem;">Memuat...</div>';

            let q;
            if (lbMode === 'local') {
                q = query(collection(db, "leaderboard"), where("city", "==", playerCity), orderBy("score", "desc"), limit(10));
            } else if (lbMode === 'today') {
                q = query(collection(db, "leaderboard_daily"), where("dateKey", "==", todayKey()), orderBy("score", "desc"), limit(10));
            } else {
                q = query(collection(db, "leaderboard"), orderBy("score", "desc"), limit(10));
            }

            unsubscribe = onSnapshot(q, (snapshot) => {
                lbList.innerHTML = "";
                if(snapshot.empty) {
                    const msg = lbMode === 'today' ? 'Belum ada skor hari ini. Jadilah yang pertama!' : 'Belum ada skor.';
                    lbList.innerHTML = `<div style="text-align:center; padding:20px; font-size:0.6rem;">${msg}</div>`;
                    return;
                }
                let rank = 1;
                snapshot.forEach((docSnap) => {
                    const d = docSnap.data();
                    const isMe = currentUser && d.uid === currentUser.uid;

                    const row = document.createElement('div');
                    row.className = 'lb-row';
                    if(isMe) row.style.color = "#E86101";

                    let locTag = lbMode !== 'local' ? `(${d.city||'?'})` : '';

                    row.innerHTML = `
                        <span style="flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;">
                            #${rank} ${d.name} ${locTag}
                        </span>
                        <span>${d.score}</span>
                    `;
                    lbList.appendChild(row);
                    rank++;
                });
            }, (err) => {
                console.error("Leaderboard query gagal:", err);
                lbList.innerHTML = `<div style="text-align:center; padding:20px; font-size:0.6rem; color:#c00;">Gagal memuat.</div>`;
            });
        }
        loadLeaderboard();

        window.saveScore = async (score) => {
            if (!currentUser || score === 0) return;
            if (score <= userHighScore) return;
            try {
                const commonFields = {
                    name: currentUser.displayName, uid: currentUser.uid, photo: currentUser.photoURL,
                    score, city: playerCity, timestamp: serverTimestamp()
                };
                // Satu dokumen per pemain (ID = uid), BUKAN addDoc baru tiap skor (itu
                // penyebab bug "satu pemain menguasai banyak baris leaderboard" yang
                // ditemukan nyata di data produksi 2026-10-04). merge:true supaya
                // dokumen yang sudah ada diperbarui, bukan diganti total.
                await setDoc(doc(db, "leaderboard", currentUser.uid), commonFields, { merge: true });
                userHighScore = score;

                // Leaderboard harian terpisah -- satu dokumen per pemain PER HARI (ID =
                // uid_tanggal), supaya tab "Hari Ini" benar-benar reset tiap hari dan
                // tidak tercampur rekor sepanjang masa. Dasar untuk fitur lomba harian
                // yang direncanakan nanti.
                const dateKey = todayKey();
                const dailyRef = doc(db, "leaderboard_daily", `${currentUser.uid}_${dateKey}`);
                const dailySnap = await getDoc(dailyRef);
                const prevDailyBest = dailySnap.exists() ? (dailySnap.data().score || 0) : 0;
                if (score > prevDailyBest) {
                    await setDoc(dailyRef, { ...commonFields, dateKey }, { merge: true });
                }
            } catch (e) { console.error(e); }
        };

        // --- VOUCHER: kode unik sekali pakai, maksimal 1x klaim per hari per akun ---
        // Sebelumnya popup voucher muncul untuk SIAPA SAJA (termasuk tamu tanpa login)
        // setiap kali skor > 100, tanpa kode/pencatatan apa pun -- bisa diklaim berkali-
        // kali hanya dengan menunjukkan layar yang sama ke kasir berulang. Sekarang:
        // wajib login (identitas nyata), satu kode unik per klaim tercatat di Firestore
        // (bisa diaudit pemilik), dan dibatasi 1x per hari per akun.
        window.tryClaimVoucher = async (score) => {
            if (score <= 100) return { ok: false, reason: 'score_too_low' };
            if (!currentUser) return { ok: false, reason: 'not_logged_in' };

            const dateKey = todayKey();
            const claimId = `${currentUser.uid}_${dateKey}`;
            const claimRef = doc(db, "voucherClaims", claimId);
            const existing = await getDoc(claimRef);
            if (existing.exists()) {
                return { ok: false, reason: 'already_claimed_today', code: existing.data().code };
            }

            const code = `DSA-${dateKey.replace(/-/g,'')}-${currentUser.uid.slice(0,5).toUpperCase()}`;
            try {
                await setDoc(claimRef, {
                    code, uid: currentUser.uid, name: currentUser.displayName, score, dateKey,
                    status: 'unclaimed', createdAt: serverTimestamp()
                });
                return { ok: true, code };
            } catch (e) {
                console.error("Gagal mencatat voucher:", e);
                return { ok: false, reason: 'error' };
            }
        };

        // Isi #voucher-body sesuai hasil tryClaimVoucher() -- dipanggil dari game.over()
        // di script kedua (lihat window.renderVoucher).
        window.renderVoucher = (result) => {
            const body = document.getElementById('voucher-body');
            if (result.reason === 'not_logged_in') {
                body.innerHTML = `
                    <div class="v-title">SKOR KAMU &gt; 100!</div>
                    <div class="v-info">Login dulu dengan Google untuk klaim hadiah spesial (gratis tiket Aviary + es jeruk).</div>
                    <button class="v-login-btn" id="voucher-login-btn">🔑 Login Google</button>
                `;
                document.getElementById('voucher-login-btn').onclick = () => signInWithPopup(auth, provider);
                return;
            }
            if (result.reason === 'already_claimed_today') {
                body.innerHTML = `
                    <div class="v-title">SUDAH KLAIM<br>HARI INI</div>
                    <div class="v-info">Kode voucher kamu hari ini:</div>
                    <div class="v-code">${result.code || '-'}</div>
                    <div class="v-info">Main lagi besok untuk dapat kode baru!</div>
                `;
                return;
            }
            if (result.reason === 'error') {
                body.innerHTML = `<div class="v-title">Gagal memproses voucher.<br>Coba lagi sebentar lagi.</div>`;
                return;
            }
            // ok: true
            body.innerHTML = `
                <div class="v-title">SELAMAT!<br>SKOR KAMU &gt; 100</div>
                <div class="v-info">Kamu berhak mendapatkan reward spesial:</div>
                <div class="v-reward">
                    GRATIS 1 TIKET<br>AVIARY / MINI ZOO<br>
                    <span style="color:#FF4500;">+</span><br>
                    1 ES JERUK
                </div>
                <div class="v-info" style="color:#000; font-weight:bold;">Tunjukkan kode ini ke<br>Kasir Resto Dolan Sawah:</div>
                <div class="v-code">${result.code}</div>
                <div class="v-warning">Satu kode hanya berlaku 1x. Jangan tutup layar ini sebelum diklaim.</div>
            `;
        };
    </script>

    <script>
        // --- AUDIO ENGINE ---
        const AudioEngine = {
            ctx: null,
            muted: localStorage.getItem('dolanAviaryMuted') === '1',
            init: function() { if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
            toggleMute: function() {
                this.muted = !this.muted;
                localStorage.setItem('dolanAviaryMuted', this.muted ? '1' : '0');
                return this.muted;
            },
            play: function(type) {
                if(this.muted) return;
                if(!this.ctx) return; if(this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination); const now = this.ctx.currentTime;

                if (type === 'jump') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(300, now); osc.frequency.linearRampToValueAtTime(600, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                } else if (type === 'score') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(800, now); osc.frequency.setValueAtTime(1200, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.2);
                    osc.start(now); osc.stop(now + 0.2);
                } else if (type === 'hit') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
                    gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
                    osc.start(now); osc.stop(now + 0.3);
                } else if (type === 'coin') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(1000, now); osc.frequency.setValueAtTime(1500, now + 0.08);
                    gain.gain.setValueAtTime(0.12, now); gain.gain.linearRampToValueAtTime(0, now + 0.18);
                    osc.start(now); osc.stop(now + 0.18);
                }
            }
        };

        // --- GAME ENGINE SETUP ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); 
        
        // speed/gap sekarang naik bertahap seiring skor (lihat currentSpeed/currentGap)
        // -- dulu konstan dari awal sampai akhir, jadi permainan tidak terasa makin
        // menantang walau skor sudah tinggi. Mentok di skor 40 supaya tetap adil/bisa
        // dimainkan, bukan naik tanpa batas.
        const CONFIG = {
            gravity: 1200, jump: 360,
            speedBase: 170, speedMax: 250, gapBase: 140, gapMin: 110, difficultyRampScore: 40,
            pipeW: 70
        };
        function difficultyT() { return Math.min(1, game.score / CONFIG.difficultyRampScore); }
        function currentSpeed() { const t = difficultyT(); return CONFIG.speedBase + (CONFIG.speedMax - CONFIG.speedBase) * t; }
        function currentGap() { const t = difficultyT(); return CONFIG.gapBase - (CONFIG.gapBase - CONFIG.gapMin) * t; }

        const assets = {
            pipe: null, ground: null, bgMid: null,
            bgFarImage: null, imgPlang: null,
            imgBirdUp: null, imgBirdDown: null, imgRusa: null, imgKelinci: null, imgDomba: null,
            imgKucing: null, imgBurungMandar: null
        };

        // Dulu di-hosting di Cloudinary (akun dn60ib3ur) -- akun itu kena disable otomatis
        // oleh Cloudinary ("exceeding usage limits", padahal cuma pakai 0.25 dari kuota 25
        // kredit) sehingga SEMUA gambar di akun itu ikut mati, bukan cuma punya game ini.
        // Dipindah 2026-10-04 ke assets/aviary-game/ di repo ini sendiri -- tidak lagi
        // bergantung pada kuota/status akun pihak ketiga mana pun. Pemilik asli file ini
        // ditemukan lagi lewat Google Photos (nama IMG_xxxx di komentar tiap baris).
        const imageURLs = {
            birdUp: 'assets/aviary-game/bird-up.png',       // IMG_7776
            birdDown: 'assets/aviary-game/bird-down.png',   // IMG_7775
            rusa: 'assets/aviary-game/rusa.png',             // IMG_7781
            kelinci: 'assets/aviary-game/kelinci.png',       // IMG_7780
            domba: 'assets/aviary-game/domba.png',           // IMG_7782
            bgMountain: 'assets/aviary-game/bg-mountain.png', // IMG_7828
            plang: 'assets/aviary-game/plang.png',           // IMG_7793
            kucing: 'assets/aviary-game/kucing.png',         // IMG_7803
            burungMandar: 'assets/aviary-game/burung-mandar.png' // IMG_7804
        };

        function loadImg(url) {
            return new Promise((resolve, reject) => {
                const img = new Image(); img.crossOrigin = "Anonymous";
                img.onload = () => resolve(img); img.onerror = () => reject(url); img.src = url;
            });
        }

        async function initAllAssets() {
            // Promise.allSettled, bukan Promise.all -- satu gambar dekorasi gagal (hosting
            // down, koneksi putus, dll) TIDAK BOLEH membuat seluruh game tidak bisa
            // dimainkan. Semua fungsi gambar di bawah (plantResized, drawBird) sudah
            // null-check (`if(!img) return`), jadi aman kalau satu aset-nya kosong -- game
            // tetap jalan, cuma elemen itu saja yang tidak tampak. Pelajaran nyata dari
            // insiden 2026-10-04: akun Cloudinary mati total, dan desain lama (Promise.all)
            // bikin game ikut mati meski penyebabnya cuma hosting gambar, bukan kode game.
            const keys = ["birdUp", "birdDown", "rusa", "kelinci", "domba", "bgMountain", "plang", "kucing", "burungMandar"];
            const results = await Promise.allSettled(keys.map((k) => loadImg(imageURLs[k])));
            const loaded = {};
            results.forEach((r, i) => {
                const key = keys[i];
                if (r.status === "fulfilled") {
                    loaded[key] = r.value;
                } else {
                    console.warn(`Gagal memuat aset "${key}" dari ${imageURLs[key]} -- game tetap jalan tanpa elemen ini.`, r.reason);
                }
            });
            assets.imgBirdUp = loaded.birdUp || null; assets.imgBirdDown = loaded.birdDown || null;
            assets.imgRusa = loaded.rusa || null; assets.imgKelinci = loaded.kelinci || null; assets.imgDomba = loaded.domba || null;
            assets.bgFarImage = loaded.bgMountain || null;
            assets.imgPlang = loaded.plang || null;
            assets.imgKucing = loaded.kucing || null;
            assets.imgBurungMandar = loaded.burungMandar || null;

            try {
                const cP = createAssetCanvas(CONFIG.pipeW, 600); drawPixelLog(cP.ctx, CONFIG.pipeW, 600); assets.pipe = cP.cvs;
                const cG = createAssetCanvas(480, 130); drawCleanGround(cG.ctx, 480, 130); assets.ground = cG.cvs;

                const cS = createAssetCanvas(480, 240);
                drawCleanBgMid(cS.ctx, 480, 240);
                assets.bgMid = cS.cvs;

                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('screen-start').style.display = 'flex';
                resize(); requestAnimationFrame(loop);

            } catch (err) {
                console.error("Gagal:", err);
                document.getElementById('loading-screen').innerHTML = "Gagal memuat aset.<br>Refresh halaman.";
            }
        }

        function createAssetCanvas(w, h) {
            const c = document.createElement('canvas'); c.width = w; c.height = h;
            const ctx = c.getContext('2d');
            ctx.imageSmoothingEnabled = false; 
            return { cvs: c, ctx: ctx };
        }

        function drawPixelRect(ctx, x, y, w, h, color) {
            ctx.fillStyle = color; ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
        }

        function drawPixelLog(ctx, w, h) {
            const cDark = "#5D4037"; const cMed = "#795548"; const cLight = "#A1887F"; const cHigh = "#D7CCC8";
            drawPixelRect(ctx, 0, 0, w*0.2, h, cDark);
            drawPixelRect(ctx, w*0.2, 0, w*0.3, h, cMed);
            drawPixelRect(ctx, w*0.5, 0, w*0.3, h, cLight);
            drawPixelRect(ctx, w*0.8, 0, w*0.2, h, cHigh);
            for(let i=0; i<h; i+=8) { 
                drawPixelRect(ctx, Math.random()*w*0.9, i, 8, 4, cDark);
                if(i%16 === 0) drawPixelRect(ctx, Math.random()*w*0.9, i+4, 6, 6, cMed);
            }
            drawLogEnd(ctx, 0, w, cDark, cMed, cLight);
            drawLogEnd(ctx, h-20, w, cDark, cMed, cLight);
        }

        function drawLogEnd(ctx, y, w, c1, c2, c3) {
            drawPixelRect(ctx, 0, y, w, 20, c1);
            drawPixelRect(ctx, 4, y+4, w-8, 12, c2);
            drawPixelRect(ctx, 12, y+8, w-24, 4, c3);
        }

        function drawCleanGround(ctx, w, h) {
            const P_SZ = 8;
            drawPixelRect(ctx, 0, 0, w, P_SZ*2, "#5cb85c");
            for(let x=0; x<w; x+=P_SZ*2) drawPixelRect(ctx, x, 0, P_SZ, P_SZ, "#71c971");
            drawPixelRect(ctx, 0, P_SZ*2, w, h-P_SZ*2, "#633d26");
            for(let x=0; x<w; x+=P_SZ*4) drawPixelRect(ctx, x, P_SZ*3, P_SZ*2, P_SZ, "#8a5a3a");
        }

        function drawBetterClouds(ctx, scrollX) {
             const cloudPos = (scrollX * 0.5);
             const canvasW = ctx.canvas.width;
             drawFluffyCloud(ctx, (100 - cloudPos) % canvasW + (cloudPos > 100 ? canvasW : 0), 100, 60);
             drawFluffyCloud(ctx, (350 - cloudPos) % canvasW + (cloudPos > 350 ? canvasW : 0), 80, 50);
             const cloudPos2 = (scrollX * 0.4);
             drawFluffyCloud(ctx, (250 - cloudPos2) % canvasW + (cloudPos2 > 250 ? canvasW : 0), 160, 40);
             drawFluffyCloud(ctx, (500 - cloudPos2) % canvasW + (cloudPos2 > 500 ? canvasW : 0), 140, 45);
        }

        function drawFluffyCloud(ctx, x, y, size) {
            let s2 = size/2;
            ctx.fillStyle = "rgba(255,255,255,0.9)";
            drawPixelRect(ctx, x - s2, y - s2/2, size, size/1.5, null); 
            drawPixelRect(ctx, x - s2 - s2/3, y, s2, s2/2, null); 
            drawPixelRect(ctx, x + s2/1.5, y - s2/3, s2, s2/1.5, null); 
             drawPixelRect(ctx, x - s2/2, y - s2/1.2, s2*1.5, s2/2, null);
        }

        // --- BACKGROUND TENGAH (FIXED SIZE ASSETS) ---
        function drawCleanBgMid(ctx, w, h) {
            // 1. Gambar Sawah Prosedural
            drawPixelRect(ctx, 0, 0, w, 60, "#71c971"); 
            drawPixelRect(ctx, 0, 55, w, 5, "#5cb85c");
            drawPixelRect(ctx, 0, 60, w, 80, "#8fbc8f");
            drawPixelRect(ctx, 0, 135, w, 5, "#71c971");
            drawPixelRect(ctx, 0, 140, w, 100, "#aedba3");
            
            const plantResized = (img, xCenter, yBottom, targetH) => {
                if(!img) return;
                let ratio = img.width / img.height; 
                let newH = targetH;                 
                let newW = newH * ratio;            
                ctx.drawImage(img, xCenter - newW / 2, yBottom - newH, newW, newH);
            };

            // 2. Gambar PLANG (Tetap di tengah, x=240)
            if (assets.imgPlang) {
                 plantResized(assets.imgPlang, 240, 150, 90);
            }

            // 3. Gambar HEWAN (Disebar agar tidak menumpuk)
            // LAYER BELAKANG (y=58)
            plantResized(assets.imgDomba, 50, 58, 30);  // Kiri jauh
            plantResized(assets.imgRusa, 430, 58, 35);   // Kanan jauh

            // LAYER TENGAH (y=138)
            plantResized(assets.imgKucing, 80, 138, 35); 
            plantResized(assets.imgDomba, 320, 138, 45); // Kanan
            plantResized(assets.imgKelinci, 400, 138, 40); // Kanan jauh

            // LAYER DEPAN (y=230)
            plantResized(assets.imgKelinci, 60, 230, 45);  // Kiri
            plantResized(assets.imgBurungMandar, 200, 230, 50); 
            plantResized(assets.imgRusa, 400, 230, 60);    // Kanan
        }

        function drawLayer(ctx, img, speedOffset, yPos, imgW, imgH) {
            if(!img) return;
            let drawW = imgW || img.width;
            let drawH = imgH || img.height;
            const numTiles = Math.ceil(canvas.width / drawW) + 1;
            const offsetMod = Math.floor(speedOffset % drawW);
            for (let i = 0; i < numTiles; i++) {
                let xPos = (i * drawW) - offsetMod;
                ctx.drawImage(img, xPos, yPos, drawW, drawH);
            }
        }

        // --- PARTIKEL (bulu kepak, ledakan nabrak, kilau koin) -- murni canvas primitif,
        // TANPA aset gambar baru, dibatasi maksimal ~70 partikel aktif supaya ringan di
        // HP lama (lihat catatan performa di bagian bawah file). ---
        function spawnParticles(x, y, count, colors, opts = {}) {
            const { spread = 120, speedMin = 40, speedMax = 140, lifeMin = 0.3, lifeMax = 0.6, sizeMin = 2, sizeMax = 4, gravity = 300 } = opts;
            for (let i = 0; i < count; i++) {
                if (game.particles.length > 70) game.particles.shift();
                const angle = (Math.random() * spread - spread / 2) * Math.PI / 180 - Math.PI / 2;
                const speed = speedMin + Math.random() * (speedMax - speedMin);
                game.particles.push({
                    x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                    life: 0, maxLife: lifeMin + Math.random() * (lifeMax - lifeMin),
                    size: sizeMin + Math.random() * (sizeMax - sizeMin),
                    color: colors[Math.floor(Math.random() * colors.length)], gravity
                });
            }
        }
        function updateParticles(dt) {
            for (let i = game.particles.length - 1; i >= 0; i--) {
                const p = game.particles[i];
                p.life += dt;
                if (p.life >= p.maxLife) { game.particles.splice(i, 1); continue; }
                p.vy += p.gravity * dt; p.x += p.vx * dt; p.y += p.vy * dt;
            }
        }
        function drawParticles(ctx) {
            for (const p of game.particles) {
                ctx.globalAlpha = Math.max(0, 1 - p.life / p.maxLife);
                ctx.fillStyle = p.color;
                ctx.fillRect(Math.floor(p.x - p.size / 2), Math.floor(p.y - p.size / 2), Math.ceil(p.size), Math.ceil(p.size));
            }
            ctx.globalAlpha = 1;
        }

        // Koin kecil digambar langsung (persegi emas yang "memipih" seiring waktu untuk
        // ilusi berputar) -- bukan gambar baru, supaya tidak menambah beban loading.
        function drawCoin(ctx, x, y, t) {
            const squish = Math.max(0.15, Math.abs(Math.sin(t * 5)));
            const w = 14 * squish, h = 14;
            ctx.fillStyle = '#FFD700';
            ctx.fillRect(Math.floor(x - w / 2), Math.floor(y - h / 2), Math.ceil(w), h);
            ctx.fillStyle = '#E6A800';
            ctx.fillRect(Math.floor(x - w / 2), Math.floor(y - h / 2), Math.ceil(w), 3);
        }

        // --- GAME LOGIC ---
        const game = {
            state: 'START', score: 0,
            bird: { y: 0, v: 0, rot: 0 },
            pipes: [], coins: [], particles: [],
            shake: { time: 0, power: 0 },
            bgOff: 0, midOff: 0, groundOff: 0,
            timeAccum: 0, graceTime: 0, lastJump: 0,

            start: function() {
                resize(); AudioEngine.init();
                this.state = 'PLAY';
                this.bird.y = canvas.height / 2 - 50; this.bird.v = 0; this.bird.rot = 0;
                this.pipes = []; this.coins = []; this.particles = []; this.shake = { time: 0, power: 0 };
                this.score = 0; this.timeAccum = 0;
                this.graceTime = 1.5; this.lastJump = 0;

                document.getElementById('voucher-overlay').style.display = 'none'; // Pastikan voucher tutup saat main baru
                document.getElementById('pause-hint').style.display = 'none';
                document.getElementById('score-display').innerText = 0;
                document.getElementById('score-display').style.display = 'block';
                document.getElementById('tutorial-hint').style.display = 'block';
                setTimeout(() => document.getElementById('tutorial-hint').style.display = 'none', 3000);
                showScreen(null);
            },

            over: async function() {
                AudioEngine.play('hit'); this.state = 'OVER';
                const flash = document.getElementById('flash-overlay');
                flash.style.opacity = 0.6; setTimeout(() => flash.style.opacity = 0, 150);
                this.shake = { time: 0.25, power: 7 };
                spawnParticles(60, this.bird.y, 18, ['#FFD700', '#FF6B6B', '#fff', '#87CEEB'],
                    { spread: 360, speedMin: 60, speedMax: 220, lifeMin: 0.4, lifeMax: 0.8, sizeMin: 3, sizeMax: 6, gravity: 400 });

                document.getElementById('final-score').innerText = this.score;

                showScreen('screen-over');
                if(window.saveScore) window.saveScore(this.score);

                // Kode unik + wajib login + maks 1x/hari -- lihat tryClaimVoucher() di
                // script Firebase (dulu: popup ini muncul untuk SIAPA SAJA tanpa kode
                // atau pencatatan apa pun, bisa diklaim berkali-kali hanya dengan
                // menunjukkan layar yang sama berulang ke kasir).
                if (this.score > 100 && window.tryClaimVoucher) {
                    const result = await window.tryClaimVoucher(this.score);
                    if (window.renderVoucher) window.renderVoucher(result);
                    document.getElementById('voucher-overlay').style.display = 'flex';
                }
            }
        };

        // Jeda otomatis kalau tab/app ditinggal (switch app, layar terkunci, dll) --
        // dulu burung terus jatuh walau pemain tidak lihat layar sama sekali. requestAnimationFrame
        // browser sendiri sebenarnya sudah berhenti total saat tab benar-benar di
        // background, tapi ini menjamin status & indikator visualnya tetap jelas begitu
        // kembali (bukan diam-diam lanjut dari posisi terakhir tanpa penjelasan).
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && game.state === 'PLAY') {
                game.state = 'PAUSED';
                document.getElementById('pause-hint').style.display = 'block';
            }
        });

        // --- BUTTON HANDLER VOUCHER ---
        document.getElementById('btn-close-voucher').onclick = () => {
             document.getElementById('voucher-overlay').style.display = 'none';
        };

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
            if(id) document.getElementById(id).style.display = 'flex';
        }

        let lastTime = performance.now();
        function loop(timestamp) {
            const dt = Math.min((timestamp - lastTime) / 1000, 0.06);
            lastTime = timestamp;

            if (game.state === 'PLAY') updatePhysics(dt);
            else if (game.state === 'START') {
                game.groundOff += CONFIG.speedBase * dt;
                game.midOff += CONFIG.speedBase * 0.1 * dt;
                game.bgOff += CONFIG.speedBase * 0.02 * dt;
                game.bird.y = canvas.height/2 - 50 + Math.sin(timestamp/300)*15;
            }
            // Partikel & shake tetap jalan di state apa pun (termasuk OVER) supaya ledakan
            // nabrak benar-benar sempat teranimasi, bukan terpotong begitu game.state berubah.
            updateParticles(dt);
            if (game.shake.time > 0) game.shake.time = Math.max(0, game.shake.time - dt);
            draw(dt); requestAnimationFrame(loop);
        }

        function updatePhysics(dt) {
            const speed = currentSpeed(); const gap = currentGap();
            if (game.graceTime > 0) game.graceTime -= dt;
            game.bird.v += CONFIG.gravity * dt; game.bird.y += game.bird.v * dt;
            if(game.bird.v < 0) game.bird.rot = Math.max(-0.4, game.bird.rot - 3 * dt);
            else game.bird.rot = Math.min(1.2, game.bird.rot + 2.5 * dt);

            game.groundOff += speed * dt;
            game.midOff += speed * 0.1 * dt;
            game.bgOff += speed * 0.02 * dt;

            game.timeAccum += dt;
            if(game.timeAccum > 1.5) {
                game.timeAccum = 0;
                let groundY = canvas.height - 130;
                let minSafe = 80; let maxSafe = groundY - gap - 80;
                let h;
                if(game.pipes.length === 0) h = Math.floor(Math.random() * (maxSafe - minSafe + 1) + minSafe);
                else {
                    let prevH = game.pipes[game.pipes.length - 1].topH;
                    let change = (Math.random() * 250 * 2) - 250; h = prevH + change;
                    if (h < minSafe) h = minSafe; if (h > maxSafe) h = maxSafe;
                }
                game.pipes.push({ x: canvas.width, topH: h, passed: false });
                // Koin bonus di tengah celah pipa -- tidak setiap pipa (60%), supaya tetap
                // terasa seperti bonus, bukan wajib diambil.
                if (Math.random() < 0.6) game.coins.push({ x: canvas.width + CONFIG.pipeW / 2, y: h + gap / 2 });
            }

            const bX = 60; const bW = 30; const bH = 28;
            for(let i=0; i<game.pipes.length; i++) {
                let p = game.pipes[i]; p.x -= speed * dt;
                if (bX + bW/2 > p.x + 4 && bX - bW/2 < p.x + CONFIG.pipeW - 4) {
                    if (game.bird.y - bH/2 < p.topH + 8 || game.bird.y + bH/2 > p.topH + gap - 8) {
                        if (game.graceTime <= 0) game.over();
                    }
                }
                if (p.x + CONFIG.pipeW < bX && !p.passed) {
                    game.score++; AudioEngine.play('score');
                    const sd = document.getElementById('score-display'); sd.innerText = game.score;
                    sd.classList.remove('score-pop'); void sd.offsetWidth; sd.classList.add('score-pop');
                    p.passed = true;
                }
                if (p.x < -CONFIG.pipeW) { game.pipes.shift(); i--; }
            }

            for (let i = 0; i < game.coins.length; i++) {
                const c = game.coins[i]; c.x -= speed * dt;
                const dx = bX - c.x, dy = game.bird.y - c.y;
                if (Math.sqrt(dx*dx + dy*dy) < 22) {
                    game.score += 3; AudioEngine.play('coin');
                    spawnParticles(c.x, c.y, 8, ['#FFD700', '#FFF4B0'],
                        { spread: 360, speedMin: 40, speedMax: 120, lifeMin: 0.3, lifeMax: 0.5, sizeMin: 2, sizeMax: 4, gravity: 150 });
                    const sd = document.getElementById('score-display'); sd.innerText = game.score;
                    sd.classList.remove('score-pop'); void sd.offsetWidth; sd.classList.add('score-pop');
                    game.coins.splice(i, 1); i--; continue;
                }
                if (c.x < -30) { game.coins.splice(i, 1); i--; }
            }

            if(game.bird.y >= canvas.height - 130 - 20) game.over();
        }

        function draw(dt) {
            ctx.clearRect(0,0,canvas.width, canvas.height);

            // Guncangan layar singkat saat nabrak -- cuma geser titik gambar beberapa
            // piksel selama ~0.25 detik, bukan efek berat. Latar langit digambar sedikit
            // melebihi batas kanvas (-12..+12) supaya pergeseran ini tidak pernah
            // menyingkap tepi kosong di pinggir layar.
            let shakeX = 0, shakeY = 0;
            if (game.shake.time > 0) {
                const s = game.shake.power * (game.shake.time / 0.25);
                shakeX = (Math.random() * 2 - 1) * s; shakeY = (Math.random() * 2 - 1) * s;
            }
            ctx.save(); ctx.translate(shakeX, shakeY);

            ctx.fillStyle = "#87CEEB";
            ctx.fillRect(-12,-12,canvas.width+24,canvas.height+24);

            drawBetterClouds(ctx, game.bgOff);

            let groundY = canvas.height - 130;

            if(assets.bgFarImage) {
                 let mH = 250;
                 let ratio = assets.bgFarImage.width / assets.bgFarImage.height;
                 let mW = mH * ratio;
                 // PERBAIKAN: Posisi dikurangi 130 agar naik ke atas (menjulang di balik sawah)
                 drawLayer(ctx, assets.bgFarImage, game.bgOff, groundY - mH - 130, mW, mH);
            }

            let midY = groundY - 220;
            drawLayer(ctx, assets.bgMid, game.midOff, midY, 480, 240);

            for(let p of game.pipes) {
                let px = Math.floor(p.x);
                ctx.save(); ctx.translate(px, p.topH); ctx.scale(1, -1); ctx.drawImage(assets.pipe, 0, 0); ctx.restore();
                ctx.drawImage(assets.pipe, px, p.topH + currentGap());
            }

            const coinT = performance.now() / 1000;
            for (const c of game.coins) drawCoin(ctx, c.x, c.y, coinT);

            drawLayer(ctx, assets.ground, game.groundOff, groundY, 480, 130);

            ctx.save(); ctx.translate(60, game.bird.y); ctx.rotate(game.bird.rot);
            if (game.graceTime > 0 && Math.floor(Date.now() / 100) % 2 === 0) ctx.globalAlpha = 0.5;
            let birdImg = assets.imgBirdUp;
            if (game.state === 'PLAY') { if (game.bird.v > 100) birdImg = assets.imgBirdDown; }
            else { if (Math.sin(Date.now() / 200) > 0) birdImg = assets.imgBirdDown; }
            if(birdImg) ctx.drawImage(birdImg, -30, -24, 60, 48);
            ctx.restore(); ctx.globalAlpha = 1.0;

            drawParticles(ctx);
            ctx.restore(); // tutup translate shake
        }

        function inputAction(e) {
            if(e.target.closest('button') || e.target.closest('.lb-container') || e.target.closest('.voucher-card')) return;
            if(game.state === 'START') game.start();
            else if (game.state === 'PAUSED') {
                game.state = 'PLAY';
                game.graceTime = Math.max(game.graceTime, 0.6); // kebal sebentar setelah lanjut, cegah mati dadakan
                lastTime = performance.now(); // cegah lonjakan dt dari waktu yang terlewat saat dijeda
                document.getElementById('pause-hint').style.display = 'none';
            }
            else if(game.state === 'PLAY') {
                const now = Date.now();
                if (now - game.lastJump > 100) {
                    game.bird.v = -CONFIG.jump; game.lastJump = now;
                    AudioEngine.play('jump'); document.getElementById('tutorial-hint').style.display = 'none';
                    spawnParticles(45, game.bird.y + 6, 3, ['#fff', '#eee', '#ddd'],
                        { spread: 50, speedMin: 15, speedMax: 50, lifeMin: 0.2, lifeMax: 0.35, sizeMin: 2, sizeMax: 3, gravity: 150 });
                }
            }
        }

        const stage = document.getElementById('game-stage');
        stage.addEventListener('pointerdown', inputAction);
        window.addEventListener('keydown', (e) => { if(['Space', 'ArrowUp', 'KeyW'].includes(e.code)) inputAction(e); });
        document.getElementById('btn-start').onclick = () => game.start();
        document.getElementById('btn-restart').onclick = () => { game.state = 'START'; showScreen('screen-start'); };

        // Mute -- diingat lintas kunjungan lewat localStorage (lihat AudioEngine.muted di
        // atas). Dibuat karena game ini dimainkan di tempat makan -- suara mendadak bisa
        // mengganggu meja lain, jadi harus gampang dimatikan.
        const btnMute = document.getElementById('btn-mute');
        function syncMuteIcon() { btnMute.textContent = AudioEngine.muted ? '🔇' : '🔊'; }
        syncMuteIcon();
        btnMute.onclick = () => { AudioEngine.toggleMute(); syncMuteIcon(); };

        function resize() {
            canvas.width = stage.clientWidth; canvas.height = stage.clientHeight; 
            ctx.imageSmoothingEnabled = false;
        }
        window.onresize = resize;
        
        initAllAssets();
    </script>
</body>
</html>
