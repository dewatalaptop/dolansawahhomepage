<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<title>Konfirmasi Reservasi · Dolan Sawah</title>
<meta name="description" content="Detail konfirmasi reservasi Anda di Dolan Sawah, lengkap dengan invoice dan peraturan reservasi.">
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" integrity="sha384-JcnsjUPPylna1s1fvi1u12X5qjY5OL56iySh75FdtrwhO/SWXgMjoVqcKyIIWOLk" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
:root{
  --ink:#1c2b22; --ink-soft:#5a6b5f; --cream:#f6f8ef; --paper:#ffffff;
  --sun:#ff8c42; --sun-deep:#e06520; --leaf:#2a7a52; --leaf-deep:#14452e; --leaf-soft:#e1f1e7;
  --amber-soft:#fff1e4; --line:#e1e7d4; --danger:#c0392b; --danger-soft:#fdeceb;
  --r:20px; --shadow:0 18px 40px -18px rgba(16,60,40,.38),0 2px 6px rgba(16,60,40,.08);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:var(--cream);min-height:100vh;line-height:1.5;
  background-image:radial-gradient(900px 380px at 0 -100px,#ffd9b8 0,rgba(255,217,184,0) 70%),radial-gradient(900px 380px at 100% -60px,#cfe8d8 0,rgba(207,232,216,0) 70%)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--sun-deep);outline-offset:3px;border-radius:10px}
.wrap{max-width:560px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px max(40px,env(safe-area-inset-bottom))}

/* ── Brand bar ── */
.banner{margin:0 0 14px;border-radius:24px;overflow:hidden;box-shadow:var(--shadow);background:#2a7a52;aspect-ratio:1400/467;animation:rise .6s var(--ease) both}
.banner img{display:block;width:100%;height:100%;object-fit:cover}

/* ── Kartu tiket ── */
.ticket{background:var(--paper);border-radius:28px;box-shadow:var(--shadow);overflow:hidden;animation:rise .7s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:none}}
.hero{position:relative;padding:26px 24px 30px;color:#fff;overflow:hidden;
  background:linear-gradient(155deg,#0f3a27 0%,#1b6244 52%,#2a7a52 100%)}
.hero::before{content:"";position:absolute;inset:0;opacity:.18;
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.7) 0 2px,transparent 2px 22px)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:210px;height:210px;border-radius:50%;
  background:radial-gradient(circle,#ff9a52 0,rgba(255,154,82,0) 68%);opacity:.8}
.hero > *{position:relative;z-index:1}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 13px 6px 10px;border-radius:99px;font-weight:800;font-size:12.5px;letter-spacing:.3px;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.32)}
.chip i{width:8px;height:8px;border-radius:50%;background:#ffa561;box-shadow:0 0 0 4px rgba(255,165,97,.3)}
.chip.bad i{background:#ff8f86;box-shadow:0 0 0 4px rgba(255,143,134,.25)}
.hero .hi{margin-top:18px;font-size:14px;opacity:.85;font-weight:600}
.hero h1{font-family:'Fraunces',serif;font-weight:700;font-size:clamp(26px,8vw,34px);line-height:1.15;margin-top:2px;word-break:break-word}
.when{margin-top:20px;display:flex;gap:12px;align-items:stretch}
.when .date{flex:1;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:16px;padding:12px 14px}
.when small{display:block;font-size:11.5px;opacity:.75;font-weight:700;text-transform:uppercase;letter-spacing:.8px}
.when strong{display:block;font-size:17px;font-weight:800;margin-top:2px}
.count{margin-top:16px;font-weight:800;font-size:14px;color:#ffc79c}

/* garis sobekan tiket */
.tear{position:relative;height:26px;background:var(--paper)}
.tear::before,.tear::after{content:"";position:absolute;top:-13px;width:26px;height:26px;border-radius:50%;background:var(--cream)}
.tear::before{left:-13px}.tear::after{right:-13px}
.tear span{position:absolute;left:22px;right:22px;top:12px;border-top:2px dashed var(--line)}

.body{padding:6px 22px 24px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.cell{background:var(--cream);border-radius:14px;padding:12px 14px}
.cell small{display:block;font-size:11.5px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.7px}
.cell b{display:block;margin-top:2px;font-size:16px;word-break:break-word;overflow-wrap:anywhere}
.cell.wide{grid-column:1/-1}
.place{position:relative;margin-top:12px;border-radius:18px;overflow:hidden;aspect-ratio:16/10;background:linear-gradient(90deg,#d9e6d6,#e9f1e4,#d9e6d6);background-size:200% 100%;animation:sh 1.3s linear infinite;box-shadow:0 10px 22px -14px rgba(16,60,40,.6)}
.place.ok{animation:none;background:#d9e6d6}
.place img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.place.ok img{opacity:1}
.place figcaption{position:absolute;left:0;right:0;bottom:0;padding:34px 14px 11px;color:#fff;font-weight:800;font-size:14px;overflow-wrap:anywhere;
  background:linear-gradient(180deg,rgba(10,40,26,0),rgba(10,40,26,.78));display:flex;align-items:center;gap:7px}
.place figcaption::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 3px rgba(255,140,66,.35)}
h2{font-family:'Fraunces',serif;font-size:18px;margin:24px 0 10px;display:flex;align-items:center;gap:9px;color:var(--leaf-deep)}
h2::before{content:"";flex:none;width:5px;height:18px;border-radius:4px;background:linear-gradient(180deg,var(--sun),var(--sun-deep))}
.menu-item{overflow-wrap:anywhere;padding:12px 0;border-bottom:1px dashed var(--line)}
.menu-item:last-child{border-bottom:0}
.menu-row{display:flex;gap:10px;align-items:baseline;justify-content:space-between}
.menu-row .n{font-weight:800}
.menu-row .n em{font-style:normal;color:var(--sun-deep);margin-right:4px}
.menu-row .p{font-weight:700;}
.menu-item ul{margin:6px 0 0 18px;color:var(--ink-soft);font-size:13.5px}
.ppnnote{margin-top:8px;font-size:12.5px;color:var(--ink-soft)}
.pay .r span strong{font-weight:800;color:var(--ink)}
.note{overflow-wrap:anywhere;background:var(--amber-soft);border-radius:14px;padding:12px 14px;font-size:14px;color:#6b3a14}

/* pembayaran */
.pay{border:1.5px solid var(--line);border-radius:18px;padding:6px 16px}
.pay .r{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.pay .r:last-child{border-bottom:0}
.pay .r span:first-child{color:var(--ink-soft);font-weight:600}
.pay .r b{font-weight:800;}
.badge{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:800;letter-spacing:.3px}
.badge.ok{background:var(--leaf-soft);color:var(--leaf)}
.badge.dp{background:var(--amber-soft);color:var(--sun-deep)}
.badge.no{background:#eceee4;color:var(--ink-soft)}
.pay .total{background:var(--cream);margin:0 -16px;padding:12px 16px;border-radius:0 0 16px 16px}

/* tombol */
.actions{display:grid;gap:12px;margin-top:26px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 20px;border-radius:16px;font-weight:800;font-size:16px;
  transition:transform .2s var(--ease),box-shadow .2s,background .2s}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:linear-gradient(135deg,var(--sun),var(--sun-deep));color:#fff;box-shadow:0 12px 24px -10px rgba(224,101,32,.7)}
.btn.primary:active{transform:scale(.97)}
.btn.ghost{background:var(--paper);border:2px solid var(--leaf);color:var(--leaf-deep)}
.btn.ghost:active{transform:scale(.97);background:var(--cream)}
.btn[disabled]{opacity:.6;pointer-events:none}
.must{display:flex;align-items:center;gap:10px;background:var(--amber-soft);border:1.5px solid #ffcfa6;color:#7a3a0c;border-radius:14px;padding:10px 13px;font-size:13.5px;font-weight:700;line-height:1.35}
.must svg{flex:none;width:22px;height:22px;color:var(--sun-deep);animation:wob 2.4s ease-in-out infinite;transform-origin:50% 0}
@keyframes wob{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(14deg)}82%{transform:rotate(-12deg)}88%{transform:rotate(8deg)}94%{transform:rotate(-4deg)}}
.btn.rulesbtn{position:relative;overflow:hidden;min-height:60px;font-size:17px;background:linear-gradient(135deg,var(--leaf),var(--leaf-deep));color:#fff;
  box-shadow:0 0 0 0 rgba(255,140,66,.7),0 14px 26px -10px rgba(20,69,46,.75);animation:glow 2.1s ease-out infinite}
.btn.rulesbtn:active{transform:scale(.97)}
.btn.rulesbtn::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;transform:skewX(-20deg);
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.38),rgba(255,255,255,0));animation:shine 3.2s ease-in-out infinite}
.btn.rulesbtn .tag{background:var(--sun);color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.6px;padding:3px 8px;border-radius:99px;text-transform:uppercase}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(255,140,66,.7),0 14px 26px -10px rgba(20,69,46,.75)}70%,100%{box-shadow:0 0 0 16px rgba(255,140,66,0),0 14px 26px -10px rgba(20,69,46,.75)}}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
.foot{margin-top:22px;text-align:center;font-size:12.5px;color:var(--ink-soft)}
.foot b{color:var(--leaf-deep)}
.btn.wa{text-decoration:none;background:#fff;border:2px solid #25a05a;color:#13703b}
.btn.wa:active{transform:scale(.97);background:#f1fbf5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row2 .btn{white-space:nowrap;min-height:52px;font-size:14.5px;padding:0 10px;gap:8px}
@media(max-width:340px){.row2{grid-template-columns:1fr}}
.tambnote{margin-top:6px;font-size:12.5px;color:var(--ink-soft)}
.cap{margin-top:18px;text-align:center;font-size:12px;color:var(--ink-soft)}

/* state: loading / pesan */
.state{background:var(--paper);border-radius:28px;box-shadow:var(--shadow);padding:44px 28px;text-align:center;animation:rise .6s var(--ease) both}
.state .ic{width:72px;height:72px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:var(--amber-soft)}
.state .ic svg{width:34px;height:34px}
.state h1{font-family:'Fraunces',serif;font-size:24px;margin-bottom:8px}
.state p{color:var(--ink-soft);max-width:34ch;margin:0 auto}
.state.bad .ic{background:var(--danger-soft)}
.sk{border-radius:28px;background:var(--paper);box-shadow:var(--shadow);overflow:hidden}
.sk .a{height:230px;background:linear-gradient(90deg,#e9dccb,#f4ebdd,#e9dccb);background-size:200% 100%;animation:sh 1.3s linear infinite}
.sk .b{height:16px;margin:18px 22px 0;border-radius:8px;background:#efe6d8}
@keyframes sh{to{background-position:-200% 0}}

/* bottom sheet peraturan */
.sheet-ov{position:fixed;inset:0;z-index:50;background:rgba(30,16,6,.55);display:flex;align-items:flex-end;justify-content:center;
  opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s linear .25s}
.sheet-ov.open{opacity:1;visibility:visible;transition:opacity .25s}
.sheet{width:100%;max-width:560px;max-height:86vh;overflow:auto;background:var(--paper);border-radius:28px 28px 0 0;padding:10px 22px max(26px,env(safe-area-inset-bottom));
  transform:translateY(40px);transition:transform .35s var(--ease)}
.sheet-ov.open .sheet{transform:none}
.grab{width:46px;height:5px;border-radius:9px;background:var(--line);margin:6px auto 14px}
.sheet h2{margin-top:6px}
.rules{list-style:none;counter-reset:r;display:grid;gap:10px;margin-top:12px}
.rules li{counter-increment:r;display:flex;gap:12px;font-size:15px}
.rules li::before{content:counter(r);flex:none;width:26px;height:26px;border-radius:50%;background:var(--amber-soft);color:var(--sun-deep);font-weight:800;font-size:13px;display:grid;place-items:center;margin-top:1px}
.rules-intro{font-size:14px;color:var(--ink-soft);margin:2px 0 6px}
.rg h3{font-size:11.500px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft);margin:20px 0 10px}
.ri{display:flex;gap:14px;padding:14px;border-radius:18px;margin-bottom:10px;background:var(--cream);border:1px solid var(--line)}
.ric{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--amber-soft);color:var(--sun-deep)}
.ric svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.900;stroke-linecap:round;stroke-linejoin:round}
.ri.good .ric{background:var(--leaf-soft);color:var(--leaf)}
.ri.bad .ric{background:var(--danger-soft);color:var(--danger)}
.ri.warn .ric{background:#fff3d6;color:#a8650a}
.ri.info .ric{background:#e6f0fb;color:#2b6cb0}
.rt{min-width:0;flex:1}
.rt>b{display:block;font-size:15.500px;line-height:1.3}
.rt p{margin-top:3px;font-size:14px;color:var(--ink-soft)}
.tiers{display:grid;gap:6px;margin-top:10px}
.tiers div{display:flex;align-items:baseline;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13.500px}
.tiers span{flex:1;color:var(--ink-soft);font-weight:600}
.tiers div b{font-weight:800;color:var(--ink)}
.tiers i{font-style:normal;font-size:12px;color:var(--ink-soft)}
.empty-rules{background:var(--cream);border-radius:14px;padding:18px;color:var(--ink-soft);text-align:center;margin-top:12px}
.sheet .btn{margin-top:22px;width:100%}

.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.3s var(--ease);z-index:60;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:380px){.grid{grid-template-columns:1fr}.hero{padding:22px 18px 26px}.body{padding:6px 16px 22px}.when{flex-direction:column}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite">
  <header class="banner"><img src="assets/reservasi/header.jpg" width="1400" height="467" alt="Dolan Sawah — konfirmasi detail reservasi" fetchpriority="high" decoding="async"></header>
  <div id="view"><div class="sk" aria-label="Memuat"><div class="a"></div><div class="b"></div><div class="b" style="width:60%"></div></div></div>
</main>

<div class="sheet-ov" id="sheetOv" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet" id="sheet">
    <div class="grab"></div>
    <h2 id="sheetTitle">Peraturan Reservasi</h2>
    <div id="rulesBody"></div>
    <button class="btn primary" id="closeSheet" type="button">Saya Mengerti</button>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ═══════════════════════════════════════════════════════════
   PERATURAN RESERVASI — ubah isi di sini.
   Struktur: grup -> butir { ic: ikon, tone: good|bad|warn|info, t: judul, d: keterangan,
   tiers: [[label, harga, false?], ...] (opsional, tabel tarif; false = tanpa sufiks "/ jam") }.
   Ikon tersedia: nocash, refund, cal, clock, timer, food, paw
   ═══════════════════════════════════════════════════════════ */
const PERATURAN_RESERVASI = [
  { title: 'Pembatalan & Reschedule', items: [
    { ic: 'nocash', tone: 'bad',  t: 'DP tidak dapat dikembalikan', d: 'Apabila reservasi dibatalkan pada H-2, H-1, atau Hari H.' },
    { ic: 'refund', tone: 'good', t: 'DP dikembalikan penuh', d: 'Apabila pembatalan dilakukan maksimal H-3.' },
    { ic: 'cal',    tone: 'info', t: 'Reschedule maksimal H-3', d: 'Perubahan waktu reservasi dapat dilakukan paling lambat H-3.' }
  ] },
  { title: 'Penggunaan Tempat', items: [
    { ic: 'clock', tone: 'good', t: 'Gratis 2,5 jam pertama', d: 'Waktu penggunaan tempat gratis selama 2,5 jam pertama.' },
    { ic: 'timer', tone: 'warn', t: 'Overtime dikenakan biaya per jam', d: 'Biaya overtime per jam, sesuai jumlah peserta:',
      tiers: [['Kurang dari 20 peserta', 'Dapat dinegosiasikan', false], ['20 – 30 peserta', 'Rp 150.000'], ['31 – 80 peserta', 'Rp 250.000'], ['Lebih dari 80 peserta', 'Rp 350.000']] }
  ] },
  { title: 'Ketentuan Umum', items: [
    { ic: 'food', tone: 'bad', t: 'Dilarang membawa makanan atau minuman dari luar', d: 'Pelanggaran dikenakan denda Rp 200.000.' },
    { ic: 'paw',  tone: 'bad', t: 'Dilarang membawa hewan peliharaan', d: '' }
  ] }
];

/* Firebase (konfigurasi publik; sama dengan form reservasi) */
firebase.initializeApp({
  apiKey: "AIzaSyA_c1tU70FM84Qi_f_aSaQ-YVLo_18lCkI",
  authDomain: "reservasi-dolan-sawah.firebaseapp.com",
  projectId: "reservasi-dolan-sawah"
});
const db = firebase.firestore();

const $ = id => document.getElementById(id);
const view = $('view');
const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const rp = n => 'Rp ' + Math.round(n || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayWIB(){ return new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Jakarta' }); }
function parseYMD(s){ const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); if (!m) return null; const d = new Date(Date.UTC(+m[1], +m[2]-1, +m[3])); return d.getUTCMonth() === +m[2]-1 && d.getUTCDate() === +m[3] ? d : null; }
function tanggalPanjang(s){ const d = parseYMD(s); return d ? `${HARI[d.getUTCDay()]}, ${d.getUTCDate()} ${BULAN[d.getUTCMonth()]} ${d.getUTCFullYear()}` : (s || '-'); }
function selisihHari(s){ const a = parseYMD(s), b = parseYMD(todayWIB()); return a && b ? Math.round((a - b) / 864e5) : null; }
function toast(t){ const e = $('toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => e.classList.remove('show'), 2600); }

const RICON = {
  nocash:'<svg viewBox="0 0 24 24"><rect x="2.500" y="6" width="19" height="12" rx="2.500"/><circle cx="12" cy="12" r="2.600"/><path d="M4 20L20 4"/></svg>',
  refund:'<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9 9.700 9.700 0 00-6.700 2.700L3 8"/><path d="M3 3v5h5"/><path d="M12 8v8M14.500 9.800c-.5-.6-1.300-1-2.500-1-1.500 0-2.500.8-2.500 1.900 0 2.600 5 1.200 5 3.700 0 1.100-1.100 1.900-2.500 1.900-1.200 0-2-.4-2.600-1.100"/></svg>',
  cal:'<svg viewBox="0 0 24 24"><rect x="3" y="4.500" width="18" height="16" rx="2.500"/><path d="M3 9.500h18M8 2.500v4M16 2.500v4"/><path d="M9 15l2 2 4-4"/></svg>',

function hitungTotal(r, menuPrices){
  if (typeof r.orderTotal === 'number') return r.orderTotal;
  if (Array.isArray(r.menus)) return r.menus.reduce((s, m) => s + (typeof m.price === 'number' ? m.price : (menuPrices[m.name] || 0)) * (parseInt(m.quantity) || 0), 0);
  return 0;
}
function statusBayar(r, total){
  const dp = Math.max(0, +r.dp || 0);
  if (r.lunas === true || (total > 0 && dp >= total)) return { kode: 'lunas', label: 'LUNAS', dibayar: total > 0 ? Math.max(total, dp) : dp, sisa: 0 };
  if (dp > 0) return { kode: 'dp', label: 'DP DIBAYAR', dibayar: dp, sisa: total > 0 ? Math.max(0, total - dp) : null };
  return { kode: 'belum', label: 'BELUM ADA PEMBAYARAN', dibayar: 0, sisa: total > 0 ? total : null };
}

/* Status reservasi: tersimpan 'batal'/'hadir'/'konfirmasi'/'approved' atau kosong (= terkonfirmasi). Nilai lain yang artinya dibatalkan atau belum dikonfirmasi jangan tampil "Terkonfirmasi". */
function statusReservasi(r){
  const v = String(r.status == null ? '' : r.status).trim().toLowerCase();
  if (['batal', 'dibatalkan', 'cancel', 'cancelled', 'canceled', 'ditolak', 'rejected'].includes(v)) return { kode: 'batal', label: 'Reservasi Dibatalkan' };
  if (['pending', 'menunggu', 'waiting'].includes(v)) return { kode: 'tunggu', label: 'Menunggu Konfirmasi' };
  return { kode: 'ok', label: 'Reservasi Terkonfirmasi' };
}

/* ── Kalender (.ics) & kontak ── */
const WA_ADMIN = '6281391414626';
function icsText(s){ return String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }
function downloadIcs(){
  const { r, id } = CUR;
  const d = parseYMD(r.date), m = /^(\d{1,2}):(\d{2})/.exec(r.jam || '');
  if (!d) { toast('Tanggal reservasi tidak valid.'); return; }
  const p2 = n => String(n).padStart(2, '0');
  const utc = t => t.getUTCFullYear() + p2(t.getUTCMonth() + 1) + p2(t.getUTCDate()) + 'T' + p2(t.getUTCHours()) + p2(t.getUTCMinutes()) + '00Z';
  let when;
  if (m && +m[1] <= 23 && +m[2] <= 59) { const st = new Date(d.getTime() + ((+m[1]) - 7) * 3600e3 + (+m[2]) * 60e3); when = 'DTSTART:' + utc(st) + '\r\nDTEND:' + utc(new Date(st.getTime() + 150 * 60e3)); } // WIB = UTC+7; durasi 2,5 jam
  else { const nx = new Date(d.getTime() + 864e5), ymd = t => t.getUTCFullYear() + p2(t.getUTCMonth() + 1) + p2(t.getUTCDate()); when = 'DTSTART;VALUE=DATE:' + ymd(d) + '\r\nDTEND;VALUE=DATE:' + ymd(nx); }
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Dolan Sawah//Reservasi//ID', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'BEGIN:VEVENT',
    'UID:' + id + '@dolansawah.my.id', 'DTSTAMP:' + utc(new Date()), when,
    'SUMMARY:' + icsText('Reservasi Dolan Sawah'),
    'LOCATION:' + icsText('Dolan Sawah' + (r.tempat ? ' - ' + r.tempat : '')),
    'DESCRIPTION:' + icsText('Reservasi a.n. ' + (r.nama || '') + ', ' + (r.jumlah || '-') + ' orang. Detail: https://www.dolansawah.my.id/reservasi.html?id=' + id),
    'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:Besok reservasi Dolan Sawah', 'TRIGGER:-P1D', 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'];
  try {
    const blob = new Blob([lines.join('\r\n') + '\r\n'], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = 'reservasi-dolan-sawah.ics'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('Acara kalender dibuat.');
  } catch (e) { console.error(e); toast('Gagal membuat acara kalender.'); }
}

/* ── Invoice PDF (dibuat di perangkat; tak ada data keluar) ── */
function downloadInvoice(){
  const btn = $('btnInv');
  if (!window.jspdf || !window.jspdf.jsPDF) { toast('Pembuat invoice belum siap. Coba lagi sebentar.'); return; }
  btn.disabled = true;
  try {
    const { r, sub, ppn, total, bayar, id } = CUR;
    const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
    const W = 210, M = 16;
    const noInv = 'INV/DS/' + String(r.date || '').replace(/-/g, '').slice(2) + '/' + id.slice(-5).toUpperCase();
    const green = [47, 125, 91], orange = [224, 101, 32], ink = [43, 26, 12], soft = [107, 90, 73], line = [234, 223, 206];
    const T = (txt, x, y, o) => doc.text(String(txt), x, y, o);

    // header
    doc.setFillColor(20, 69, 46); doc.rect(0, 0, W, 42, 'F');
    doc.setFillColor(255, 140, 66); doc.rect(0, 42, W, 2.200, 'F');
    doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(22); T('Dolan Sawah', M, 20);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(200, 230, 214); T('dolansawah.my.id', M, 27);
    doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(26); T('INVOICE', W - M, 21, { align: 'right' });
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(200, 230, 214); T(noInv, W - M, 28, { align: 'right' });

    // status
    const col = bayar.kode === 'lunas' ? green : orange;
    doc.setDrawColor(...col); doc.setLineWidth(.8); doc.setTextColor(...col);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(12);
    const sw = doc.getTextWidth(bayar.label) + 12;
    doc.roundedRect(W - M - sw, 52, sw, 10, 2, 2, 'S'); T(bayar.label, W - M - sw / 2, 58.600, { align: 'center' });

    // info tamu
    let y = 54;
    doc.setTextColor(...soft); doc.setFont('helvetica', 'normal'); doc.setFontSize(9); T('DITERBITKAN UNTUK', M, y);
    doc.setTextColor(...ink); doc.setFont('helvetica', 'bold'); doc.setFontSize(15);
    const nm = doc.splitTextToSize(String(r.nama || '-'), 100); T(nm, M, y + 7); y += 7 + nm.length * 6.500;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10.500); doc.setTextColor(...ink);
    const info = [['Tanggal reservasi', tanggalPanjang(r.date)], ['Jam', r.jam || '-'], ['Tempat', r.tempat || '-'], ['Jumlah tamu', (r.jumlah || '-') + ' orang'],
      ['Tanggal terbit', tanggalPanjang(todayWIB())]];
    y += 2;
    info.forEach(([k, v]) => { doc.setTextColor(...soft); T(k, M, y); doc.setTextColor(...ink); T(': ' + v, M + 38, y); y += 6; });

    // tabel item
    y += 6;
    const cx = { item: M + 3, qty: 128, harga: 158, sub: W - M - 3 };
    const head = () => {
      doc.setFillColor(251, 246, 238); doc.rect(M, y, W - 2 * M, 9, 'F');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(9.500); doc.setTextColor(...soft);
      T('ITEM PESANAN', cx.item, y + 6); T('QTY', cx.qty, y + 6, { align: 'center' }); T('HARGA', cx.harga, y + 6, { align: 'right' }); T('SUBTOTAL', cx.sub, y + 6, { align: 'right' });
      y += 9;
    };
    head();
    const items = (Array.isArray(r.menus) && r.menus.length ? r.menus : (r.menu ? [{ name: r.menu, quantity: 1 }] : []));
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10.500);
    items.forEach(m => {
      const q = parseInt(m.quantity) || 0, p = typeof m.price === 'number' ? m.price : 0;
      const nameLines = doc.splitTextToSize(String(m.name), 82);
      const h = Math.max(9, nameLines.length * 5.200 + 4);
      if (y + h > 262) { doc.addPage(); y = 20; head(); doc.setFont('helvetica', 'normal'); doc.setFontSize(10.500); }
      doc.setTextColor(...ink); T(nameLines, cx.item, y + 6);
      T(String(q), cx.qty, y + 6, { align: 'center' });
      T(p > 0 ? rp(p) : '-', cx.harga, y + 6, { align: 'right' }); T(p > 0 ? rp(p * q) : '-', cx.sub, y + 6, { align: 'right' });
      y += h; doc.setDrawColor(...line); doc.setLineWidth(.2); doc.line(M, y, W - M, y);
    });
    if (!items.length) { doc.setTextColor(...soft); T('Belum ada pesanan menu.', cx.item, y + 6); y += 10; }

    // ringkasan
    if (y > 225) { doc.addPage(); y = 20; }
    y += 8;
    const bx = 108, bw = W - M - bx;
    const rows = [];
    if (sub > 0) rows.push(['Subtotal pesanan', rp(sub), false], ['PPN 10%', rp(ppn), false], ['Total (termasuk PPN)', rp(total), false]);
    if (bayar.dibayar > 0) rows.push([bayar.kode === 'lunas' ? 'Telah dibayar' : 'DP dibayar' + (r.tipeDp ? ' (' + r.tipeDp + ')' : ''), rp(bayar.dibayar), false]);
    if (bayar.sisa != null) rows.push(['Sisa pembayaran', bayar.sisa === 0 ? 'Rp 0' : rp(bayar.sisa), true]);
    rows.forEach(([k, v, strong]) => {
      if (strong) { doc.setFillColor(...(bayar.kode === 'lunas' ? [227, 242, 234] : [255, 241, 228])); doc.roundedRect(bx, y - 5.500, bw, 10, 2, 2, 'F'); }
      doc.setFont('helvetica', strong ? 'bold' : 'normal'); doc.setFontSize(strong ? 12 : 10.500); doc.setTextColor(...(strong ? col : ink));
      T(k, bx + 3, y + 1); T(v, W - M - 3, y + 1, { align: 'right' }); y += strong ? 12 : 8;
    });
    if (!rows.length) { doc.setTextColor(...soft); doc.setFontSize(10); T('Belum ada rincian pembayaran.', bx + 3, y); y += 8; }

    // catatan & footer
    if (y > 250) { doc.addPage(); y = 20; }

    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(...soft);
    const cat = bayar.kode === 'lunas' ? 'Pembayaran reservasi ini telah lunas. Terima kasih atas kepercayaan Anda.' : bayar.kode === 'dp' ? 'Invoice ini menunjukkan DP yang telah diterima. Sisa pembayaran dilunasi pada hari kunjungan.' : 'Belum ada pembayaran yang tercatat untuk reservasi ini.';
    const catL = doc.splitTextToSize(cat, W - 2 * M); T(catL, M, y); y += catL.length * 4.500;
    if (sub > 0) { T(doc.splitTextToSize('Harga item belum termasuk PPN 10 persen. Total di atas sudah termasuk PPN.', W - 2 * M), M, y + 1); }
    const pages = doc.getNumberOfPages();
    for (let i = 1; i <= pages; i++) {
      doc.setPage(i); doc.setDrawColor(...line); doc.setLineWidth(.3); doc.line(M, 280, W - M, 280);
      doc.setFontSize(8.500); doc.setTextColor(...soft); T('Dolan Sawah · dolansawah.my.id · Invoice dibuat otomatis dari data reservasi', W / 2, 286, { align: 'center' });
      if (pages > 1) T(i + '/' + pages, W - M, 286, { align: 'right' });
    }
    const safe = String(r.nama || 'Tamu').replace(/[^\w]+/g, '-').replace(/^-|-$/g, '').slice(0, 30) || 'Tamu';
    doc.save(`Invoice-DolanSawah-${safe}-${r.date || ''}.pdf`);
    toast('Invoice diunduh ✓');
  } catch (e) {
    console.error(e); toast('Gagal membuat invoice. Coba lagi.');
  } finally { btn.disabled = false; }
}

/* ── Muat data ── */
/* Foto lokasi: foto di koleksi locations berupa data-URI (~100 KB/lokasi), jadi ambil HANYA lokasi yang dipilih (query nama), bukan seluruh koleksi. Tidak pernah melempar. */
async function loadFotos(r){
  const fotos = [];
  try {
    const tp = String(r.tempat || '').trim();
    const nama = [tp, ...(tp.includes(',') || /\s(?:dan|&|\+)\s/i.test(tp) ? tp.split(/\s*(?:,|\+|&|\bdan\b)\s*/) : [])].filter((x, i, ar) => x && ar.indexOf(x) === i).slice(0, 4);
    for (const n of nama) {
      if (fotos.length >= 3) break;
      const qs = await db.collection('locations').where('name', '==', n).limit(1).get();
      qs.forEach(l => { const x = l.data(); if (x && typeof x.imageUrl === 'string' && /^(https:\/\/|data:image\/(jpeg|png|webp);base64,)/i.test(x.imageUrl) && !fotos.some(f => f.name === n)) fotos.push({ name: n, url: x.imageUrl }); });
      if (n === tp && fotos.length) break;
    }
  } catch (e) {}
  return fotos;
}


(async function init(){
  const q = new URLSearchParams(location.search);
  const id = (q.get('id') || '').trim();
  if (!/^[A-Za-z0-9]{15,40}$/.test(id)) { stateView('bad', 'Tautan tidak valid', 'Mohon gunakan tautan yang dikirim oleh Dolan Sawah melalui WhatsApp.'); return; }
  // Kedaluwarsa diputuskan oleh tanggal pada data (bukan param d), agar reservasi yang di-reschedule tetap bisa dibuka lewat tautan lama.
  try {
    const snap = await db.collection('reservations').doc(id).get();
    if (!snap.exists) { stateView('bad', 'Reservasi tidak ditemukan', 'Tautan mungkin sudah tidak berlaku. Silakan hubungi Dolan Sawah.'); return; }
    const r = snap.data();
    if (!parseYMD(r.date) || r.date < todayWIB()) { stateView('', 'Halaman ini sudah berakhir', 'Tanggal reservasi telah terlewati, sehingga halaman ini tidak lagi tersedia. Terima kasih telah berkunjung ke Dolan Sawah 🌾'); return; }
    // Menu & foto lokasi saling bebas -> diambil bersamaan.
    const fotoP = loadFotos(r);
    // Detail menu + harga cadangan (reservasi lama tanpa snapshot harga). Gagal = diabaikan.
    const menuDetail = {}, menuPrices = {};
    try {
      const ms = await db.collection('menus').get();
      ms.forEach(m => { const x = m.data(); menuDetail[m.id] = Array.isArray(x.details) ? x.details : []; menuPrices[m.id] = typeof x.price === 'number' ? x.price : 0; });
    } catch (e) {}
    if (Array.isArray(r.menus)) r.menus = r.menus.map(m => ({ ...m, price: typeof m.price === 'number' ? m.price : (menuPrices[m.name] || 0) }));
    const sub = hitungTotal(r, menuPrices), ppn = Math.round(sub * PPN_RATE), total = sub + ppn;
    const fotos = await fotoP;
    CUR = { id, r, sub, ppn, total, bayar: statusBayar(r, total), menuDetail, fotos };
    render();
  } catch (e) {
    console.error(e);
    stateView('bad', 'Gagal memuat', 'Periksa koneksi internet Anda lalu muat ulang halaman ini.');
  }
})();
</script>
